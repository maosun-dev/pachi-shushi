<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ワンタップ収支</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFFFFF; --ink:#1A1A1A; --sub:#7A7A7A; --line:#E4E4E4; --soft:#F4F4F4;
  --plus:#1D6B4A; --minus:#A8262C; --adh:50px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --ink:#ECECEC; --sub:#8E8E8E; --line:#2C2C2C; --soft:#1E1E1E;
    --plus:#5CC79A; --minus:#F07A7F;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --ink:#ECECEC; --sub:#8E8E8E; --line:#2C2C2C; --soft:#1E1E1E;
  --plus:#5CC79A; --minus:#F07A7F;
}
:root[data-theme="light"] input[type=date]{color-scheme:light}
:root[data-theme="dark"] input[type=date]{color-scheme:dark}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);transition:background .2s,color .2s;
  font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;font-weight:400;
  -webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}

/* one-screen layout */
.app{height:100%;min-height:540px;max-width:460px;margin:0 auto;display:flex;flex-direction:column;
  padding:4px 20px calc(var(--adh) + 14px)}
.top{display:flex;justify-content:space-between;align-items:center;height:40px;flex-shrink:0}
.tbtn{background:none;border:0;color:var(--sub);font:400 13px "Noto Sans JP",sans-serif;cursor:pointer;padding:8px 0}
.tbtn.done{color:var(--ink);font-weight:700}
.ehint{font-size:12px;color:var(--sub);text-align:center;flex:1;padding:0 8px}
.theme{background:none;border:0;color:var(--sub);width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer}

.hero{flex:1;min-height:120px;display:flex;align-items:center;justify-content:center;padding:4px 0 10px}
.totalbtn{display:block;width:100%;background:none;border:0;color:inherit;cursor:pointer;padding:6px 0;border-radius:10px}
.ylabel{font-size:13px;letter-spacing:.14em;color:var(--sub);text-align:center}
.total{font-family:"Shippori Mincho","Yu Mincho",serif;font-weight:800;font-size:clamp(38px,12vw,56px);line-height:1.15;
  text-align:center;margin:8px 0 2px;word-break:break-all;font-variant-numeric:tabular-nums}
.total.plus{color:var(--plus)}.total.minus{color:var(--minus)}
.hint{font-size:12px;color:var(--sub);text-align:center}

:root{--rowh:clamp(52px,calc((100dvh - 470px) / 3.4),72px)}
.entry{flex-shrink:0;border-top:1px solid var(--line);padding-top:16px}
.ratebox{height:calc(var(--rowh) * 3 + 16px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.rates{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:var(--rowh);gap:8px}
.bottom{flex-shrink:0;padding-top:8px}
.rate{position:relative;height:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:0 4px;
  font:500 15px "Noto Sans JP",sans-serif;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rate[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.editing .rate{border-style:dashed}
.editing .rate[aria-pressed="true"]{background:var(--bg);color:var(--ink);border-color:var(--line)}
.editing .rate.picked{border:2px solid var(--ink);background:var(--soft);color:var(--ink)}
.editing.haspick .rate:not(.picked):not(.addtile){border-color:var(--sub)}
.rate .x{position:absolute;top:-1px;right:-1px;width:26px;height:26px;border-radius:0 6px 0 6px;background:var(--minus);color:#fff;
  font-size:14px;line-height:26px;text-align:center;display:none}
.editing .rate .x{display:block}
.addlink{display:block;margin:4px 0 0 auto;background:none;border:0;color:var(--sub);font:400 13px "Noto Sans JP",sans-serif;cursor:pointer;padding:6px 0}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
label{display:block;font-size:11px;color:var(--sub);letter-spacing:.08em;margin-bottom:2px}
input{width:100%;font:500 17px "Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);
  border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 1px;outline:none;font-variant-numeric:tabular-nums;min-width:0}
input:focus{border-bottom-color:var(--ink)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;font-size:14px;height:37px;line-height:24px;text-align:left;padding:6px 1px}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.btn{width:100%;border-radius:6px;padding:14px;font:500 15px "Noto Sans JP",sans-serif;letter-spacing:.06em;cursor:pointer}
.add{border:1px solid var(--ink);background:var(--ink);color:var(--bg);margin-top:14px}
.add:disabled{opacity:.25;cursor:default}
.plus-t{color:var(--plus)}.minus-t{color:var(--minus)}

/* ad slot */
.ad{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);
  padding:0 20px env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
.ad .slot{width:100%;max-width:420px;height:var(--adh);border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:var(--sub);font-size:11px;letter-spacing:.2em;background:var(--soft)}

/* sheets */
.sheet{position:fixed;left:0;right:0;top:0;bottom:calc(var(--adh) + env(safe-area-inset-bottom,0px));background:var(--bg);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);transform:translateX(100%);transition:transform .25s ease;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
#sheetA{z-index:10}#sheetM{z-index:11}#sheetL{z-index:12}#sheetD{z-index:13}
.tags{display:inline-flex;gap:6px;margin-left:6px}
.tags span{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:10px;padding:0 7px;line-height:18px}
.dsec{margin-top:22px}
.dsec h3{font-size:12px;font-weight:500;color:var(--sub);letter-spacing:.1em;margin:0 0 8px;display:flex;justify-content:space-between}
.dsec h3 em{font-style:normal;font-weight:400}
textarea{width:100%;min-height:110px;resize:vertical;font:400 15px/1.7 "Noto Sans JP",sans-serif;color:var(--ink);background:var(--soft);
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none}
textarea:focus{border-color:var(--ink)}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.imgs button{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:0;background:var(--soft);cursor:pointer;color:var(--sub);
  font:400 13px "Noto Sans JP",sans-serif}
.imgs img{width:100%;height:100%;object-fit:cover;display:block}
.imgs .addimg{border-style:dashed;background:none}
.dnote{font-size:12px;color:var(--sub)}
.delrec{display:block;margin:30px auto 0;background:none;border:0;color:var(--minus);font:400 14px "Noto Sans JP",sans-serif;cursor:pointer;padding:10px}
.viewer{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.92);display:none;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.viewer.on{display:flex}
.viewer .vbar{display:flex;justify-content:space-between;padding:10px 16px}
.viewer .vbar button{background:none;border:0;color:#fff;font:400 15px "Noto Sans JP",sans-serif;cursor:pointer;padding:8px}
.viewer .vbar .vdel{color:#FF8A8E}
.viewer .vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
.viewer img,.viewer video{max-width:100%;max-height:100%;object-fit:contain}
.imgs button{position:relative}
.imgs video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.imgs .vtag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px}
body.kb .ad{display:none}
.editbox{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:8px}
.editbox[hidden]{display:none}
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
select{width:100%;font:500 16px "Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);border:0;border-bottom:1px solid var(--line);
  border-radius:0;padding:8px 0;outline:none;-webkit-appearance:none;appearance:none}
.eacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.eacts .btn{margin-top:0}
.ghost2{border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.csvrow{margin:30px 0 0;text-align:center;font-size:12px;color:var(--sub)}
.csvrow button{background:none;border:0;color:var(--sub);font:400 12px "Noto Sans JP",sans-serif;text-decoration:underline;cursor:pointer;padding:8px 4px}
.csvrow [hidden]{display:none}
.memosave{display:block;margin:8px 0 0 auto;background:none;border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:6px 14px;
  font:400 13px "Noto Sans JP",sans-serif;cursor:pointer}
.sheet .in{max-width:460px;margin:0 auto;padding:14px 22px 30px}
.shead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:6px}
.shead h2{font-size:16px;font-weight:700;margin:0;letter-spacing:.06em;text-align:center}
.back{background:none;border:0;color:var(--ink);font:500 15px "Noto Sans JP",sans-serif;cursor:pointer;padding:6px 0;min-width:60px;text-align:left}
.shead .sp{min-width:60px}
.yearbar{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:10px}
.yearbar button{background:none;border:1px solid var(--line);color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.yearbar span{font-size:14px;letter-spacing:.12em;color:var(--sub);min-width:90px;text-align:center}
.sum{text-align:center;padding:14px 0 10px}
.sum .lbl{font-size:12px;color:var(--sub);letter-spacing:.1em}
.sum .st{font-size:12px;color:var(--sub);margin-top:6px}
.sum .v{font-family:"Shippori Mincho",serif;font-weight:800;font-size:34px;margin-top:4px;font-variant-numeric:tabular-nums}
.monthbtn{display:block;margin:2px auto 12px;background:none;border:1px solid var(--ink);color:var(--ink);border-radius:20px;
  padding:8px 26px;font:500 14px "Noto Sans JP",sans-serif;letter-spacing:.1em;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.row .n{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
button.row{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;text-align:left}
button.row:disabled{cursor:default}
.row small{color:var(--sub);font-size:12px;margin-left:8px}
.chev{color:var(--sub);margin-left:6px}
.meta{flex:1;min-width:0}
.meta small{display:block;margin:2px 0 0}
.del{border:1px solid var(--line);background:none;color:var(--sub);font:400 12px "Noto Sans JP",sans-serif;padding:6px 10px;border-radius:14px;cursor:pointer}
.empty{color:var(--sub);font-size:14px;padding:20px 0;text-align:center}
.mrow{display:grid;grid-template-columns:38px 1fr 96px;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);
  width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.mrow:disabled{cursor:default}
.mrow .m{font-size:14px;color:var(--sub)}
.mrow .track{position:relative;height:14px}
.mrow .track::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line)}
.mrow .track i{position:absolute;top:0;height:100%;border-radius:2px}
.mrow .track i.p{left:50%;background:var(--plus)}
.mrow .track i.n{right:50%;background:var(--minus)}
.mrow .n{text-align:right;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

/* dialogs */
.dlg{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:20px}
.dlg.on{display:flex}
.dlg .box{background:var(--bg);color:var(--ink);border-radius:10px;padding:22px;width:100%;max-width:340px;border:1px solid var(--line)}
.dlg h3{margin:0 0 16px;font-size:16px;font-weight:700}
.dlg p{margin:0;font-size:14px;line-height:1.7;white-space:pre-line}
.dlg .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.dlg .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.dlg .acts .btn{margin-top:0}
.dlg .ghost{border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.dlg .danger{border:1px solid var(--minus);background:var(--minus);color:#fff}
.dlg .small{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.6}

.toast{position:fixed;left:50%;bottom:calc(var(--adh) + 20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:70;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:4px;font-size:14px;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="tbtn" id="editBtn">編集</button>
    <span class="ehint" id="ehint" hidden>動かしたいボタンをタップ</span>
    <button class="theme" id="theme">☾</button>
  </div>

  <div class="hero" aria-live="polite">
    <button class="totalbtn" id="openSum" aria-label="詳細を見る">
      <div class="ylabel" id="yLabel">2026年の収支</div>
      <div class="total" id="total">±0円</div>
      <div class="hint">詳細 ›</div>
    </button>
  </div>

  <div class="entry">
    <div class="ratebox" id="ratebox">
      <div class="rates" id="rates"></div>
    </div>
    <button class="addlink" id="addLink">＋ 項目を追加</button>
    <div class="bottom">
    <div class="fields">
      <div><label for="inv">投資</label><input id="inv" inputmode="numeric" placeholder="0"></div>
      <div><label for="ret">回収</label><input id="ret" inputmode="numeric" placeholder="0"></div>
      <div><label for="date">日付</label><input id="date" type="date"></div>
    </div>
    <button class="btn add" id="add" disabled>項目を選択</button>
    </div>
  </div>
</div>

<div class="ad" aria-label="広告枠"><div class="slot">広告</div></div>

<div class="sheet" id="sheetA" aria-hidden="true"><div class="in">
  <div class="shead"><button class="back" data-close="sheetA">‹ 戻る</button><h2>収支の詳細</h2><span class="sp"></span></div>
  <div class="yearbar">
    <button id="prevY" aria-label="前の年">‹</button>
    <span id="aYear">2026年</span>
    <button id="nextY" aria-label="次の年">›</button>
  </div>
  <div class="sum"><div class="v" id="aV"></div><div class="st" id="aSt"></div></div>
  <button class="monthbtn" id="openMonth">月別</button>
  <div id="aList"></div>
  <div class="csvrow">CSV　<button id="exportCsv" hidden>書き出す</button><span id="csvSep" hidden>・</span><button id="importCsv">読み込む</button></div>
  <input type="file" id="csvFile" accept=".csv,text/csv,text/comma-separated-values,application/vnd.ms-excel,text/plain" hidden>
</div></div>

<div class="sheet" id="sheetM" aria-hidden="true"><div class="in">
  <div class="shead"><button class="back" data-close="sheetM">‹ 戻る</button><h2>月別収支</h2><span class="sp"></span></div>
  <div class="sum"><div class="lbl" id="mL"></div><div class="v" id="mV"></div></div>
  <div id="mList"></div>
</div></div>

<div class="sheet" id="sheetL" aria-hidden="true"><div class="in">
  <div class="shead"><button class="back" data-close="sheetL">‹ 戻る</button><h2 id="lT"></h2><span class="sp"></span></div>
  <div class="sum"><div class="lbl" id="lL"></div><div class="v" id="lV"></div></div>
  <div id="lList"></div>
</div></div>

<div class="sheet" id="sheetD" aria-hidden="true"><div class="in">
  <div class="shead"><button class="back" id="closeD">‹ 戻る</button><h2 id="dT"></h2><button class="back" id="editRec" style="text-align:right">修正</button></div>
  <div class="sum"><div class="lbl" id="dL"></div><div class="v" id="dV"></div><div class="st" id="dSt"></div></div>
  <div class="editbox" id="editBox" hidden>
    <div class="egrid">
      <div><label for="eRate">項目</label><select id="eRate"></select></div>
      <div><label for="eDate">日付</label><input id="eDate" type="date"></div>
      <div><label for="eInv">投資（円）</label><input id="eInv" inputmode="numeric" placeholder="0"></div>
      <div><label for="eRet">回収（円）</label><input id="eRet" inputmode="numeric" placeholder="0"></div>
    </div>
    <div class="eacts"><button class="btn ghost2" id="eCancel">やめる</button><button class="btn add" id="eSave">保存する</button></div>
  </div>
  <div class="dsec">
    <h3><span>メモ</span><em id="memoState"></em></h3>
    <textarea id="memo" placeholder="店・機種・出来事など"></textarea>
    <button class="memosave" id="memoSave">メモを保存</button>
  </div>
  <div class="dsec" id="imgSec">
    <h3><span>画像・動画</span><em id="imgState"></em></h3>
    <div class="imgs" id="imgs"></div>
    <input type="file" id="imgFile" accept="image/*,video/*" multiple hidden>
  </div>
  <button class="delrec" id="delRec">この記録を削除</button>
</div></div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="画像">
  <div class="vbar"><button id="vClose">閉じる</button><button class="vdel" id="vDel">この画像を削除</button></div>
  <div class="vimg" id="vBox"></div>
</div>

<div class="dlg" id="dlgRate" role="dialog" aria-modal="true" aria-labelledby="drT"><div class="box">
  <h3 id="drT">項目を追加</h3>
  <label for="rName">名前</label>
  <input id="rName" placeholder="例：1.25パチ" maxlength="10">
  <div class="acts"><button class="btn ghost" id="rCancel">やめる</button><button class="btn add" id="rOk">追加する</button></div>
</div></div>

<div class="dlg" id="dlgAsk" role="alertdialog" aria-modal="true" aria-labelledby="askT"><div class="box">
  <h3 id="askT">削除しますか？</h3>
  <p id="askP"></p>
  <div class="acts"><button class="btn ghost" id="askNo">やめる</button><button class="btn danger" id="askYes">削除する</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const BASE=[
  {id:"1p",name:"1パチ",kind:"p"},{id:"2p",name:"2パチ",kind:"p"},{id:"4p",name:"4パチ",kind:"p"},
  {id:"5s",name:"5スロ",kind:"s"},{id:"10s",name:"10スロ",kind:"s"},{id:"20s",name:"20スロ",kind:"s"}
];
let state={entries:[],custom:[],order:[],deleted:[]};
const NOW=new Date().getFullYear();
let year=NOW, sel=null, store=null, newKind="p", listFilter=null;
const allRates=()=>orderedRates();
const rateOf=id=>BASE.concat(state.custom).find(r=>r.id===id)||{id,name:"削除した項目"};

const $=id=>document.getElementById(id);
const yen=n=>(n>0?"+":n<0?"−":"±")+Math.abs(n).toLocaleString("ja-JP")+"円";
const cls=n=>n>0?"plus-t":n<0?"minus-t":"";
const num=v=>{const n=parseInt(String(v).replace(/[^\d]/g,""),10);return isNaN(n)?0:n};
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const yearEntries=()=>state.entries.filter(e=>e.date.startsWith(year+"-"));
const bal=list=>list.reduce((s,e)=>s+e.ret-e.inv,0);
function el(tag,c,t){const e=document.createElement(tag);if(c)e.className=c;if(t!=null)e.textContent=t;return e}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2000)}

/* confirm replacement (browser confirm is blocked inside the app viewer) */
function ask(msg){
  return new Promise(res=>{
    $("askP").textContent=msg;$("dlgAsk").classList.add("on");
    const done=v=>{$("dlgAsk").classList.remove("on");$("askYes").onclick=$("askNo").onclick=null;res(v)};
    $("askYes").onclick=()=>done(true);$("askNo").onclick=()=>done(false);
  });
}

/* rate buttons */
let editing=false;
function orderedRates(){
  const all=BASE.concat(state.custom), map=new Map(all.map(r=>[r.id,r]));
  const ids=(state.order||[]).filter(id=>map.has(id));
  for(const r of all)if(!ids.includes(r.id))ids.push(r.id);
  return ids.map(id=>map.get(id));
}
function selectRate(id){sel=id;document.querySelectorAll("#rates .rate").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.id===sel)));updateBtn()}
function buildRates(){
  const g=$("rates");g.innerHTML="";
  for(const r of orderedRates()){
    const b=el("button","rate",r.name);b.dataset.id=r.id;b.setAttribute("aria-pressed",String(r.id===sel));
    if(r.custom){const x=el("span","x","×");x.setAttribute("aria-hidden","true");b.append(x)}
    b.addEventListener("click",e=>{
      if(!editing){selectRate(r.id);return}
      if(e.target.closest(".x")){removeRate(r);return}
      tapEdit(r.id);
    });
    g.appendChild(b);
  }
}
/* tap-to-swap reorder (edit mode) */
let picked=null;
function hint(){$("ehint").textContent=picked?"入れ替える相手をタップ":"動かしたいボタンをタップ"}
function tapEdit(id){
  if(!picked){picked=id}
  else if(picked===id){picked=null}
  else{
    const ids=orderedRates().map(r=>r.id),a=ids.indexOf(picked),b=ids.indexOf(id);
    [ids[a],ids[b]]=[ids[b],ids[a]];state.order=ids;picked=null;persist();buildRates();
  }
  document.querySelectorAll("#rates .rate").forEach(x=>x.classList.toggle("picked",x.dataset.id===picked));
  document.body.classList.toggle("haspick",!!picked);hint();
}
function setEditing(v){
  editing=v;document.body.classList.toggle("editing",v);
  $("editBtn").textContent=v?"完了":"編集";$("editBtn").classList.toggle("done",v);
  $("ehint").hidden=!v;picked=null;document.body.classList.remove("haspick");
  document.querySelectorAll("#rates .rate").forEach(x=>x.classList.remove("picked"));hint();
}
$("editBtn").onclick=()=>setEditing(!editing);
$("addLink").onclick=()=>openAdd();
function openAdd(){$("rName").value="";$("dlgRate").classList.add("on");setTimeout(()=>$("rName").focus(),50)}
$("rCancel").onclick=()=>$("dlgRate").classList.remove("on");
$("rOk").onclick=()=>{
  const name=$("rName").value.trim();
  if(!name){$("rName").focus();return}
  if(orderedRates().some(r=>r.name===name)){toast("同じ名前の項目があります");return}
  const r={id:"c"+Date.now(),name,custom:true};
  state.custom.push(r);state.order=orderedRates().map(x=>x.id);persist();buildRates();
  $("dlgRate").classList.remove("on");toast(name+" を追加しました");
  $("ratebox").scrollTop=$("ratebox").scrollHeight;
  if(!editing)selectRate(r.id);
};
async function removeRate(r){
  const used=state.entries.filter(e=>e.rate===r.id).length;
  const msg=used?r.name+" のボタンを削除します。\nこの項目の記録"+used+"件は残り、「削除した項目」として集計されます。":r.name+" のボタンを削除します。";
  if(!await ask(msg))return;
  state.custom=state.custom.filter(x=>x.id!==r.id);
  state.order=(state.order||[]).filter(id=>id!==r.id);
  if(sel===r.id)sel=null;
  persist();buildRates();updateBtn();render();toast("削除しました");
}

async function saveMemo(force){
  clearTimeout(memoTimer);
  const e=findEntry(cur);if(!e)return;
  const v=$("memo").value.trim(), t=e.t;
  const changed=(e.memo||"")!==v;
  if(changed){if(v)e.memo=v;else delete e.memo;touch(e)}
  if(!changed&&force!==true){$("memoState").textContent=v?"保存済み":"";return}
  $("memoState").textContent="保存中…";
  let ok=await persist();
  {const e2=findEntry(t);if(e2&&(e2.memo||"")!==v){if(v)e2.memo=v;else delete e2.memo;touch(e2);ok=await persist()}}
  if(!ok){$("memoState").textContent="保存に失敗"+(lastErr&&lastErr.code?"（"+lastErr.code+"）":"");return}
  if(store.check){
    try{
      const chk=()=>Promise.race([store.check(t),new Promise((_,rj)=>setTimeout(()=>rj({code:"timeout"}),8000))]);
      let got=await chk();
      if(got!==v){const e3=findEntry(t);if(e3){if(v)e3.memo=v;else delete e3.memo;touch(e3)}await persist();got=await chk()}
      if(got===v){$("memoState").textContent="保存しました ✓";if(force===true)toast("メモを保存しました")}
      else{$("memoState").textContent="保存が反映されていません（"+(got===null?"記録なし":"内容違い")+"）"}
    }catch(err){$("memoState").textContent="確認できませんでした（"+(err&&err.code||"error")+"）"}
  }else{$("memoState").textContent="この端末だけに保存しました";if(force===true)toast("この端末だけに保存しました")}
}
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1600,k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(b=>b&&b.size?res(b):rej(new Error("encode")),"image/jpeg",0.82);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("load"))};
    img.src=url;
  });
}
const UPMSG={too_large:"20MBを超えるファイルは添付できません",unsupported_type:"この形式は添付できません",quota_or_state:"保存容量がいっぱいです",
  rate_limited:"少し待ってからもう一度お試しください",upstream_auth:"ページを開き直してください"};
async function uploadOne(f){
  const isVideo=(f.type||"").startsWith("video/")||/\.(mov|mp4|m4v|webm)$/i.test(f.name||"");
  let blob=f,type;
  if(isVideo){type=/webm/i.test(f.type)?"video/webm":"video/mp4"}
  else{try{blob=await shrink(f);type="image/jpeg"}catch(_){type=f.type||"image/jpeg"}}
  if(blob.size>(assets.maxBytes||20*1024*1024))throw {code:"too_large"};
  let r;
  try{r=await assets.upload(blob,{type})}
  catch(err){if(err&&err.code==="store_unavailable"){await new Promise(z=>setTimeout(z,800));r=await assets.upload(blob,{type})}else throw err}
  urlCache[r.id]=r.url;
  return {id:r.id,k:isVideo?"v":"i"};
}
$("imgFile").onchange=async ev=>{
  const files=[...ev.target.files];ev.target.value="";
  const t=cur;if(!findEntry(t)||!assets||!files.length)return;
  let ok=0;
  for(let i=0;i<files.length;i++){
    $("imgState").textContent="アップロード中… "+(i+1)+"/"+files.length;
    try{
      const it=await uploadOne(files[i]);
      const e=findEntry(t);if(!e)break;
      e.media=mediaOf(e).concat(it);delete e.imgs;touch(e);ok++;
      await persist();renderMedia();
    }catch(err){
      const c=err&&err.code;toast(UPMSG[c]||("添付できませんでした"+(c?"（"+c+"）":"")));
    }
  }
  $("imgState").textContent=ok?ok+"件 追加しました":"";
  if(ok&&window.Ads)Ads.afterAttach();
};

/* CSV export */
let downloads=null;
function csvCell(v,text){
  let t=String(v==null?"":v);
  if(text&&/^[=+\-@\t\r]/.test(t))t="'"+t;
  return /[",\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;
}
$("exportCsv").onclick=async()=>{
  if(!downloads)return;
  const list=[...state.entries].sort((a,b)=>a.date.localeCompare(b.date)||a.t-b.t);
  if(!list.length){toast("書き出す記録がありません");return}
  const rows=[["日付","項目","投資","回収","収支","メモ","画像・動画の数"]];
  for(const e of list)rows.push([e.date,rateOf(e.rate).name,e.inv,e.ret,e.ret-e.inv,e.memo||"",mediaOf(e).length]);
  const body=rows.map((r,i)=>r.map((c,j)=>csvCell(c,i>0&&(j===1||j===5))).join(",")).join("\r\n");
  try{
    await downloads.save({filename:"pachi-shushi-"+today()+".csv",data:"\uFEFF"+body});
    toast("書き出しました（"+list.length+"件）");
  }catch(err){
    if(err&&err.code==="declined")return;
    toast("書き出せませんでした"+(err&&err.code?"（"+err.code+"）":""));
  }
};

/* CSV import */
function parseCsv(text){
  text=text.replace(/^\uFEFF/,"");
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);f="";rows.push(row);row=[]}
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function normDate(v){
  const m=String(v).trim().match(/^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})日?$/);
  if(!m)return null;
  const y=+m[1],mo=+m[2],d=+m[3],dt=new Date(y,mo-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
  return y+"-"+pad(mo)+"-"+pad(d);
}
const unguard=t=>String(t).replace(/^'(?=[=+\-@])/,"");
$("importCsv").onclick=()=>$("csvFile").click();
$("csvFile").onchange=async ev=>{
  const f=ev.target.files[0];ev.target.value="";if(!f)return;
  let text;try{text=await f.text()}catch(_){toast("ファイルを読み込めませんでした");return}
  const rows=parseCsv(text);
  if(rows.length<2){toast("記録が見つかりませんでした");return}
  const head=rows[0].map(x=>x.trim());
  const cD=head.indexOf("日付"),cR=head.indexOf("項目"),cI=head.indexOf("投資"),cO=head.indexOf("回収"),cM=head.indexOf("メモ");
  if(cD<0||cR<0||cI<0||cO<0){toast("日付・項目・投資・回収の列が必要です");return}
  const have=new Map();
  for(const e of state.entries){const k=e.date+"|"+rateOf(e.rate).name+"|"+e.inv+"|"+e.ret;have.set(k,(have.get(k)||0)+1)}
  const byName=new Map(orderedRates().map(r=>[r.name,r]));
  let added=0,dup=0,bad=0,newRates=0;const now=Date.now();
  for(let i=1;i<rows.length;i++){
    const r=rows[i],date=normDate(r[cD]||""),name=unguard((r[cR]||"").trim()).slice(0,10);
    if(!date||!name){bad++;continue}
    const inv=num(r[cI]||""),ret=num(r[cO]||"");
    const k=date+"|"+name+"|"+inv+"|"+ret;
    if(have.get(k)>0){have.set(k,have.get(k)-1);dup++;continue}
    let rate=byName.get(name);
    if(!rate){rate={id:"c"+now+"_"+newRates,name,custom:true};state.custom.push(rate);byName.set(name,rate);newRates++}
    const e={t:now+i,rate:rate.id,inv,ret,date,u:now};
    const memo=cM>=0?unguard(r[cM]||"").trim():"";
    if(memo)e.memo=memo;
    state.entries.push(e);added++;
  }
  if(newRates)state.order=orderedRates().map(x=>x.id);
  if(added||newRates){buildRates();render();await persist()}
  toast(added?added+"件 追加（重複"+dup+"・不可"+bad+"）":"追加なし（重複"+dup+"・不可"+bad+"）");
};

/* storage: one write at a time, latest state wins */
let ready=false, writing=null, dirty=false, lastErr=null, lastOk=true;
function persist(){
  localStore.save(state);
  if(!store.remote)return Promise.resolve(true);
  dirty=true;
  if(writing)return writing;
  writing=(async()=>{
    let ok=true;
    while(dirty){
      dirty=false;
      const snap=JSON.parse(JSON.stringify(state));
      const once=()=>Promise.race([store.remote(snap),new Promise((_,rj)=>setTimeout(()=>rj({code:"timeout"}),10000))]);
      try{await once()}
      catch(err){
        if(err&&(err.code==="unavailable"||err.code==="resource_exhausted")){
          await new Promise(z=>setTimeout(z,900));
          try{await once()}catch(e2){ok=false;lastErr=e2}
        }else{ok=false;lastErr=err}
      }
    }
    writing=null;lastOk=ok;
    if(!ok)toast("保存できませんでした"+(lastErr&&lastErr.code?"（"+lastErr.code+"）":""));
    return ok;
  })();
  return writing;
}
function norm(s){s=s||{};return {entries:(Array.isArray(s)?s:(s.entries||[])).map(normEntry),custom:s.custom||[],order:s.order||[],deleted:s.deleted||[]}}
const localStore={
  load(){try{return norm(JSON.parse(localStorage.getItem("pachi-shushi")||"null"))}catch(e){return norm()}},
  save(d){try{localStorage.setItem("pachi-shushi",JSON.stringify(d))}catch(e){}}
};
store={remote:null};
state=localStore.load();
buildRates();render();

(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    try{assets=await claude.use("assets")}catch(_){assets=null}
    try{downloads=await claude.use("downloads");$("exportCsv").hidden=!downloads;$("csvSep").hidden=!downloads}catch(_){downloads=null}
    if(!db||!user){assets=null;return}
    const id=await user.id();if(!id){assets=null;return}
    const ref=db.doc("data/users/"+id+"/log");
    const snap=await ref.get();
    const remote=norm(snap.exists?snap.data():{});
    const del=new Set(remote.deleted.concat(state.deleted||[]));
    const local=new Map(state.entries.map(e=>[e.t,e]));
    for(const r of remote.entries){
      const l=local.get(r.t);
      if(!l)state.entries.push(r);
      else if((r.u||0)>(l.u||0)){for(const k of Object.keys(l))delete l[k];Object.assign(l,r)}
    }
    const seenC=new Set(remote.custom.map(c=>c.id));
    const merged={
      entries:state.entries.filter(e=>!del.has(e.t)),
      custom:remote.custom.concat(state.custom.filter(c=>!seenC.has(c.id))),
      order:remote.order.length?remote.order:state.order,
      deleted:[...del].slice(-500)
    };
    store={remote:d=>ref.set({entries:d.entries,custom:d.custom,order:d.order,deleted:d.deleted||[]}),
      check:async t=>{const sn=await ref.get();const es=sn.exists?(sn.data().entries||[]):[];const x=es.find(e=>e.t===t);return x?(x.memo||""):null}};
    const changed=JSON.stringify(merged)!==JSON.stringify(remote);
    state.entries=merged.entries;state.custom=merged.custom;state.order=merged.order;state.deleted=merged.deleted;
    ready=true;
    if(changed)await persist();
    buildRates();render();
  }catch(err){}
})();
</script>
